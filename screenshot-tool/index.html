<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼图改图小工具</title>
<script src="./fabric.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2937; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1890ff; color: #fff; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .hint { margin-left: auto; font-size: 12px; opacity: .9; }
  .body { flex: 1; display: flex; min-height: 0; }
  .toolbar { width: 76px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
  .tool { width: 56px; height: 56px; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; color: #475569; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; user-select: none; }
  .tool:hover { border-color: #1890ff; color: #1890ff; }
  .tool.active { background: #1890ff; color: #fff; border-color: #1890ff; }
  .tool .ic { font-size: 18px; line-height: 1; }
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stage-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fafafa; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .stage-bar label { font-size: 12px; color: #475569; }
  .stage-bar input[type=number] { width: 64px; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 12px; }
  .canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 20px; background: #eef1f4; position: relative; }
  .canvas-wrap.drag { outline: 2px dashed #1890ff; outline-offset: -10px; background: #e3f0ff; }
  .side { width: 210px; background: #fff; border-left: 1px solid #e5e7eb; padding: 14px; overflow-y: auto; }
  .side h3 { font-size: 13px; margin: 0 0 8px; color: #1f2937; }
  .side .row { margin-bottom: 14px; }
  .side .row .desc { font-size: 11px; color: #9aa3af; line-height: 1.5; margin-top: 4px; }
  .side .ctl { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .side .ctl label { font-size: 12px; color: #475569; }
  .side input[type=number] { width: 56px; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 12px; }
  .side input[type=color] { width: 34px; height: 28px; padding: 0; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
  .btn { padding: 7px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; color: #1f2937; }
  .btn:hover { border-color: #1890ff; color: #1890ff; }
  .btn.primary { background: #1890ff; color: #fff; border-color: #1890ff; }
  .btn.primary:hover { background: #0c7ae0; color: #fff; }
  .btn.danger { color: #e24b4a; border-color: #f09595; }
  .btn.danger:hover { background: #fcebeb; }
  .btn.block { display: block; width: 100%; margin-bottom: 8px; text-align: center; }
  .stage-bar .filebtn { position: relative; overflow: hidden; }
  .stage-bar .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .zoombox { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; }
  .zoombox .btn { padding: 4px 9px; font-size: 14px; line-height: 1; }
  .zoombox #zoomLabel { font-size: 12px; min-width: 46px; text-align: center; color: #475569; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>拼图改图小工具</h1>
    <span class="hint">离线可用 · 单文件 · Fabric.js</span>
  </header>
  <div class="body">
    <div class="toolbar" id="toolbar">
      <div class="tool active" data-mode="select"><span class="ic">↖</span>选择</div>
      <div class="tool" data-mode="mosaic"><span class="ic">▦</span>马赛克</div>
      <div class="tool" data-mode="rect"><span class="ic">▭</span>矩形</div>
      <div class="tool" data-mode="circle"><span class="ic">◯</span>画圈</div>
      <div class="tool" data-mode="line"><span class="ic">／</span>直线</div>
      <div class="tool" data-mode="arrow"><span class="ic">↗</span>箭头</div>
      <div class="tool" data-mode="text"><span class="ic">T</span>文字</div>
    </div>
    <div class="stage">
      <div class="stage-bar">
        <label class="btn primary filebtn">打开图片
          <input type="file" id="fileInput" accept="image/*" multiple>
        </label>
        <label class="btn filebtn">添加图片
          <input type="file" id="addInput" accept="image/*" multiple>
        </label>
        <button class="btn" id="openRetainBtn" title="用系统选择器打开单张图片，记住路径后可一键覆盖保存（需 Chrome/Edge）">打开原图(可回存)</button>
        <label>画布宽 <input type="number" id="cw" value="900"></label>
        <label>画布高 <input type="number" id="ch" value="600"></label>
        <button class="btn" id="applySize">应用尺寸</button>
        <button class="btn" id="autoFitBtn" title="按当前内容自动裁掉右侧/底部空白">自动调整</button>
        <button class="btn" id="newCanvas">新建画布</button>
        <button class="btn" id="bgWhite">白底</button>
        <button class="btn" id="bgTrans">透明底</button>
        <span class="zoombox">
          <button class="btn" id="zoomOut" title="缩小">−</button>
          <span id="zoomLabel">100%</span>
          <button class="btn" id="zoomIn" title="放大">＋</button>
          <button class="btn" id="zoomFit" title="缩放到适应窗口">适应</button>
        </span>
        <span style="font-size:11px;color:#9aa3af;margin-left:auto;">提示：可直接把图片拖进画布（=添加）</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="c" width="900" height="600"></canvas>
      </div>
    </div>
    <div class="side">
      <div class="row">
        <h3>导出 / 操作</h3>
        <button class="btn primary block" id="saveBtn">保存为 PNG</button>
        <button class="btn block" id="saveAsBtn">另存为…</button>
        <button class="btn block" id="undoBtn">撤销 (Ctrl+Z)</button>
        <button class="btn danger block" id="delBtn">删除选中</button>
        <button class="btn block" id="clearBtn">清空画布</button>
        <div class="desc" id="srcInfo" style="margin-top:8px;"></div>
      </div>
      <div class="row">
        <h3>线条样式</h3>
        <div class="ctl">
          <label>颜色</label>
          <input type="color" id="lineColor" value="#e24b4a">
          <label>粗细</label>
          <input type="number" id="lineWidth" value="3" min="1" max="40">
        </div>
        <div class="desc">用于直线 / 箭头 / 矩形 / 圆圈 的描边。</div>
      </div>
      <div class="row">
        <h3>选中对象</h3>
        <button class="btn block" id="shadowBtn">切换阴影</button>
        <div class="ctl">
          <label>边框</label>
          <input type="number" id="bw" value="0" min="0" max="40">
          <input type="color" id="bcolor" value="#1890ff">
        </div>
        <div class="desc">选中图片或图形后：点"切换阴影"加/去投影；设边框宽度与颜色即时生效。</div>
      </div>
      <div class="row">
        <h3>文字样式</h3>
        <div class="ctl">
          <label>字号</label>
          <input type="number" id="tfSize" value="28" min="8" max="200">
          <input type="color" id="tfColor" value="#e24b4a">
        </div>
        <div class="desc">新建文字采用此处字号/颜色；选中已有文字改这里即时更新。</div>
      </div>
      <div class="row">
        <h3>当前工具说明</h3>
        <div class="desc" id="modeDesc">选择：拖动 / 缩放 / 选中画布上的对象。</div>
      </div>
      <div class="row">
        <h3>快捷键</h3>
        <div class="desc">
          · Delete / Backspace：删除选中<br>
          · Ctrl+Z：撤销<br>
          · 双击文字：编辑内容
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // designW/H = 导出逻辑尺寸；viewZoom = 视图缩放（仅影响显示，不影响导出）
  let designW = 900, designH = 600, viewZoom = 1;

  const canvas = new fabric.Canvas("c", {
    backgroundColor: "#ffffff",
    preserveObjectStacking: true,
    enableRetinaScaling: false,
    selection: true
  });

  let mode = "select";
  let preview = null;       // 绘制中的临时对象（矩形/圆/直线）
  let startX = 0, startY = 0;
  let mosaicRect = null;    // 马赛克选区预览
  let sourceHandle = null;  // File System Access API 句柄（可回存原文件）
  let sourceName = "";
  let sourceMime = "image/png";
  const history = [];
  const MAX_HISTORY = 40;

  // ---------- 历史快照 ----------
  function snapshot() {
    try {
      history.push(JSON.stringify(canvas.toJSON(["selectable", "evented"])));
      if (history.length > MAX_HISTORY) history.shift();
    } catch (e) { /* 忽略序列化失败 */ }
  }
  function undo() {
    if (history.length <= 1) return;
    history.pop();
    const prev = history[history.length - 1];
    canvas.loadFromJSON(prev, function () {
      setMode(mode);
      canvas.requestRenderAll();
    });
  }

  // ---------- 画布尺寸 / 缩放 ----------
  function applyZoom(z) {
    viewZoom = Math.max(0.1, Math.min(4, z));
    canvas.setZoom(viewZoom);
    canvas.setDimensions({ width: Math.round(designW * viewZoom), height: Math.round(designH * viewZoom) });
    const lbl = document.getElementById("zoomLabel");
    if (lbl) lbl.textContent = Math.round(viewZoom * 100) + "%";
  }
  function setDesignSize(w, h) {
    designW = Math.max(50, Math.min(8000, Math.round(w)));
    designH = Math.max(50, Math.min(8000, Math.round(h)));
    applyZoom(viewZoom);
  }
  function fitToWindow() {
    const wrap = document.querySelector(".canvas-wrap");
    const availW = wrap.clientWidth - 80;
    const availH = wrap.clientHeight - 80;
    if (designW <= 0 || designH <= 0 || availW <= 0 || availH <= 0) return;
    const z = Math.min(availW / designW, availH / designH, 4);
    applyZoom(Math.max(0.1, z));
  }

  // ---------- 模式切换 ----------
  const modeDesc = {
    select: "选择：拖动 / 缩放 / 选中画布上的对象。",
    mosaic: "马赛克：在画布上按住拖拽框选区域，松手即对选区打马赛克。",
    rect: "矩形：按住拖拽画出矩形框（描边无填充），用于标注。",
    circle: "画圈：以按下点为圆心拖拽画圆。",
    line: "直线：按住拖拽画一条直线。",
    arrow: "箭头：按住拖拽画一条带箭头的指示线。",
    text: "文字：点击画布插入文本框，双击可编辑内容。"
  };

  function applyFlagsTo(obj) {
    const interactive = (mode === "select");
    obj.set({ selectable: interactive, evented: interactive });
  }

  function setMode(m) {
    mode = m;
    const interactive = (m === "select");
    canvas.selection = interactive;
    canvas.defaultCursor = interactive ? "default" : "crosshair";
    canvas.forEachObject(function (obj) { applyFlagsTo(obj); });
    document.querySelectorAll(".tool").forEach(function (el) {
      el.classList.toggle("active", el.dataset.mode === m);
    });
    document.getElementById("modeDesc").textContent = modeDesc[m] || "";
    canvas.requestRenderAll();
  }

  document.getElementById("toolbar").addEventListener("click", function (e) {
    const t = e.target.closest(".tool");
    if (!t) return;
    setMode(t.dataset.mode);
  });

  // ---------- 图片加入画布 ----------
  // opts: { initCanvas, withShadow, left, top }
  function addImageFromURL(url, opts) {
    opts = opts || {};
    fabric.Image.fromURL(url, function (img) {
      if (!img || !img.width) { canvas.requestRenderAll(); return; }
      const w = img.width, h = img.height;
      img.set({
        left: opts.left != null ? opts.left : 0,
        top: opts.top != null ? opts.top : 0,
        scaleX: 1, scaleY: 1, originX: "left", originY: "top"
      });
      if (opts.withShadow) {
        img.set("shadow", new fabric.Shadow({ color: "rgba(0,0,0,0.35)", blur: 10, offsetX: 4, offsetY: 4 }));
      }
      applyFlagsTo(img);
      canvas.add(img);
      // 画布为空时（或首次初始化），把画布设为该图原始尺寸
      const wasEmpty = (canvas.getObjects().length === 1);
      if (opts.initCanvas || wasEmpty) {
        setDesignSize(w, h);
        document.getElementById("cw").value = w;
        document.getElementById("ch").value = h;
      }
      canvas.requestRenderAll();
      snapshot();
    }, { crossOrigin: "anonymous" });
  }

  function loadImg(url) {
    return new Promise(function (resolve) {
      fabric.Image.fromURL(url, function (img) { resolve(img || null); }, { crossOrigin: "anonymous" });
    });
  }

  // 多张图片：横排自动排版（原始尺寸、带阴影）
  function layoutImages(urls, opts) {
    Promise.all(urls.map(loadImg)).then(function (imgs) {
      const list = imgs.filter(function (im) { return im && im.width; });
      if (!list.length) return;
      const gap = 16;
      let totalW = 0, maxH = 0;
      list.forEach(function (im) { totalW += im.width; maxH = Math.max(maxH, im.height); });
      totalW += gap * (list.length - 1);
      let x = 0;
      list.forEach(function (im) {
        im.set({ left: x, top: 0, scaleX: 1, scaleY: 1, originX: "left", originY: "top" });
        if (opts && opts.withShadow) {
          im.set("shadow", new fabric.Shadow({ color: "rgba(0,0,0,0.35)", blur: 10, offsetX: 4, offsetY: 4 }));
        }
        applyFlagsTo(im);
        canvas.add(im);
        x += im.width + gap;
      });
      setDesignSize(totalW, maxH);
      document.getElementById("cw").value = Math.round(totalW);
      document.getElementById("ch").value = Math.round(maxH);
      canvas.requestRenderAll();
      snapshot();
      fitToWindow();
    });
  }

  // 打开图片 = 初始化画布（多选则自动横排）
  function openFiles(files) {
    if (!files.length) return;
    clearSource();
    canvas.clear();
    canvas.backgroundColor = "#ffffff";
    const urls = files.map(function (f) { return URL.createObjectURL(f); });
    if (urls.length === 1) {
      addImageFromURL(urls[0], { initCanvas: true, withShadow: false });
    } else {
      layoutImages(urls, { withShadow: true });
    }
  }

  // 添加图片 = 在现有画布追加（原始尺寸、带阴影、错位摆放）
  function addFiles(files) {
    if (!files.length) return;
    let off = 0;
    files.forEach(function (f) {
      addImageFromURL(URL.createObjectURL(f), { withShadow: true, left: 30 + off, top: 30 + off });
      off += 24;
    });
  }

  // 点击「打开图片」
  document.getElementById("fileInput").addEventListener("change", function (e) {
    const files = Array.prototype.slice.call(e.target.files || []).filter(function (f) {
      return f.type && f.type.indexOf("image/") === 0;
    });
    openFiles(files);
    e.target.value = "";
  });
  // 点击「添加图片」
  document.getElementById("addInput").addEventListener("change", function (e) {
    const files = Array.prototype.slice.call(e.target.files || []).filter(function (f) {
      return f.type && f.type.indexOf("image/") === 0;
    });
    addFiles(files);
    e.target.value = "";
  });

  // 拖拽打开图片（=添加）
  const wrap = document.querySelector(".canvas-wrap");
  ["dragenter", "dragover"].forEach(function (ev) {
    wrap.addEventListener(ev, function (e) { e.preventDefault(); wrap.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    wrap.addEventListener(ev, function (e) { e.preventDefault(); wrap.classList.remove("drag"); });
  });
  wrap.addEventListener("drop", function (e) {
    const files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []).filter(function (f) {
      return f.type && f.type.indexOf("image/") === 0;
    });
    addFiles(files);
  });

  // ---------- 记住原文件并覆盖保存（File System Access API） ----------
  function supportsFSA() {
    return typeof window.showOpenFilePicker === "function" &&
           typeof window.showSaveFilePicker === "function";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function mimeFromName(name) {
    const ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
    if (ext === "png") return "image/png";
    if (ext === "webp") return "image/webp";
    return "image/png";
  }
  function clearSource() {
    sourceHandle = null; sourceName = ""; sourceMime = "image/png";
    const sb = document.getElementById("saveBtn");
    if (sb) sb.textContent = "保存为 PNG";
    updateSourceInfo();
  }
  function updateSourceInfo() {
    const el = document.getElementById("srcInfo");
    if (!el) return;
    if (sourceHandle) {
      el.innerHTML = "已绑定原文件：<b>" + escapeHtml(sourceName) + "</b><br>点「覆盖原文件」将直接覆盖该文件。";
    } else {
      el.innerHTML = supportsFSA()
        ? "未绑定原文件：保存将下载 PNG。<br>用「打开原图(可回存)」可一键覆盖保存。"
        : "当前浏览器不支持直接回存（需 Chrome / Edge）。保存将下载 PNG。";
    }
  }
  function flashSaved(msg) {
    const el = document.getElementById("srcInfo");
    if (!el) return;
    el.innerHTML = "<b style='color:#16a34a;'>✅ " + escapeHtml(msg) + "</b>";
    setTimeout(function () { updateSourceInfo(); }, 2600);
  }
  // 导出 Blob：始终以 designW×designH（原始尺寸）输出，与视图缩放无关
  function exportBlob(mime, quality) {
    return new Promise(function (resolve) {
      const mult = viewZoom > 0 ? 1 / viewZoom : 1;
      const dataURL = canvas.toDataURL({ multiplier: mult });
      const img = new Image();
      img.onload = function () {
        const tmp = document.createElement("canvas");
        tmp.width = Math.round(designW); tmp.height = Math.round(designH);
        const ctx = tmp.getContext("2d");
        if (mime === "image/jpeg") { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, tmp.width, tmp.height); }
        ctx.drawImage(img, 0, 0, tmp.width, tmp.height);
        tmp.toBlob(function (b) { resolve(b); }, mime, quality);
      };
      img.src = dataURL;
    });
  }

  async function openRetain() {
    if (!supportsFSA()) {
      alert("当前浏览器不支持直接覆盖原文件，请用 Chrome 或 Edge 打开本工具。");
      return;
    }
    let handles;
    try {
      handles = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: "图片", accept: { "image/*": [".png", ".jpg", ".jpeg", ".webp"] } }]
      });
    } catch (e) { return; }
    const handle = handles[0];
    const file = await handle.getFile();
    if (canvas.getObjects().length) {
      if (!confirm("打开原图将清空当前画布（可撤销）后载入该图片，继续？")) return;
      canvas.clear(); canvas.backgroundColor = "#ffffff";
    }
    sourceHandle = handle;
    sourceName = file.name;
    sourceMime = (file.type && file.type.indexOf("image/") === 0) ? file.type : mimeFromName(file.name);
    addImageFromURL(URL.createObjectURL(file), { initCanvas: true, withShadow: false });
    document.getElementById("saveBtn").textContent = "覆盖原文件";
    updateSourceInfo();
  }
  document.getElementById("openRetainBtn").addEventListener("click", openRetain);
  if (!supportsFSA()) {
    const b = document.getElementById("openRetainBtn");
    b.disabled = true; b.style.opacity = ".5"; b.title = "需 Chrome / Edge 才支持直接回存原文件";
  }

  async function saveOverwriteOrDownload() {
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    if (sourceHandle && supportsFSA()) {
      try {
        const blob = await exportBlob(sourceMime, 0.92);
        const writable = await sourceHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        flashSaved("已覆盖：" + sourceName);
        return;
      } catch (e) {
        alert("覆盖保存失败（可能权限已失效），已改为下载到本地。");
      }
    }
    const url = canvas.toDataURL({ format: "png", multiplier: 1 / viewZoom });
    const a = document.createElement("a");
    a.href = url; a.download = "导出图_" + Date.now() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  }
  async function saveAs() {
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    if (!supportsFSA()) {
      const url = canvas.toDataURL({ format: "png", multiplier: 1 / viewZoom });
      const a = document.createElement("a");
      a.href = url; a.download = sourceName || ("导出图_" + Date.now() + ".png");
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: sourceName || ("导出图_" + Date.now() + ".png"),
        types: [{ description: "图片", accept: { "image/png": [".png"], "image/jpeg": [".jpg", ".jpeg"] } }]
      });
    } catch (e) { return; }
    const mime = mimeFromName(handle.name);
    const blob = await exportBlob(mime, 0.92);
    const writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
    flashSaved("已另存为：" + handle.name);
  }

  // ---------- 绘制：矩形 / 圆 / 直线 / 箭头 / 马赛克 ----------
  function lineColor() { return document.getElementById("lineColor").value || "#e24b4a"; }
  function lineWidth() { return parseInt(document.getElementById("lineWidth").value, 10) || 3; }

  function startDraw(p) {
    startX = p.x; startY = p.y;
    const col = lineColor(), lw = lineWidth();
    if (mode === "rect") {
      preview = new fabric.Rect({
        left: p.x, top: p.y, width: 0, height: 0,
        fill: "transparent", stroke: col, strokeWidth: lw, strokeUniform: true,
        selectable: false, evented: false, originX: "left", originY: "top"
      });
      canvas.add(preview);
    } else if (mode === "circle") {
      preview = new fabric.Circle({
        left: p.x, top: p.y, radius: 0,
        fill: "transparent", stroke: col, strokeWidth: lw, strokeUniform: true,
        selectable: false, evented: false, originX: "left", originY: "top"
      });
      canvas.add(preview);
    } else if (mode === "line" || mode === "arrow") {
      preview = new fabric.Line([p.x, p.y, p.x, p.y], {
        stroke: col, strokeWidth: lw, strokeUniform: true,
        selectable: false, evented: false
      });
      canvas.add(preview);
    } else if (mode === "mosaic") {
      mosaicRect = new fabric.Rect({
        left: p.x, top: p.y, width: 0, height: 0,
        fill: "rgba(24,144,255,0.18)", stroke: "#1890ff",
        strokeDashArray: [4, 4], selectable: false, evented: false,
        originX: "left", originY: "top"
      });
      canvas.add(mosaicRect);
    }
  }

  function moveDraw(p) {
    if (preview && (mode === "rect")) {
      preview.set({
        left: Math.min(startX, p.x), top: Math.min(startY, p.y),
        width: Math.abs(p.x - startX), height: Math.abs(p.y - startY)
      });
      canvas.requestRenderAll();
    } else if (preview && mode === "circle") {
      const r = Math.sqrt(Math.pow(p.x - startX, 2) + Math.pow(p.y - startY, 2));
      preview.set({ radius: r, left: startX - r, top: startY - r });
      canvas.requestRenderAll();
    } else if (preview && (mode === "line" || mode === "arrow")) {
      preview.set({ x2: p.x, y2: p.y });
      canvas.requestRenderAll();
    } else if (mosaicRect) {
      mosaicRect.set({
        left: Math.min(startX, p.x), top: Math.min(startY, p.y),
        width: Math.abs(p.x - startX), height: Math.abs(p.y - startY)
      });
      canvas.requestRenderAll();
    }
  }

  function makeArrow(x1, y1, x2, y2, col, lw) {
    const dx = x2 - x1, dy = y2 - y1;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 3) return null;
    const headLen = Math.min(20, len * 0.4);
    const line = new fabric.Line([x1, y1, x2, y2], { stroke: col, strokeWidth: lw, strokeUniform: true });
    const tri = new fabric.Triangle({
      width: headLen, height: headLen * 0.66, fill: col,
      left: x2, top: y2, originX: "center", originY: "center", angle: angle + 90
    });
    return new fabric.Group([line, tri]);
  }

  function endDraw() {
    if (mode === "mosaic") { finalizeMosaic(); return; }
    if (!preview) return;
    const obj = preview; preview = null;
    if (mode === "rect" && (obj.width < 3 || obj.height < 3)) { canvas.remove(obj); canvas.requestRenderAll(); return; }
    if (mode === "circle" && obj.radius < 3) { canvas.remove(obj); canvas.requestRenderAll(); return; }
    if (mode === "line") {
      const len = Math.sqrt(Math.pow(obj.x2 - obj.x1, 2) + Math.pow(obj.y2 - obj.y1, 2));
      if (len < 3) { canvas.remove(obj); canvas.requestRenderAll(); return; }
    }
    if (mode === "arrow") {
      canvas.remove(obj);
      const grp = makeArrow(startX, startY, obj.x2, obj.y2, lineColor(), lineWidth());
      if (!grp) { canvas.requestRenderAll(); return; }
      applyFlagsTo(grp);
      canvas.add(grp);
      canvas.requestRenderAll();
      snapshot();
      return;
    }
    obj.setCoords();
    applyFlagsTo(obj);
    canvas.requestRenderAll();
    snapshot();
  }

  // 马赛克：区域像素化（用 toCanvasElement 取设计坐标，与缩放无关）
  function finalizeMosaic() {
    const r = mosaicRect; mosaicRect = null;
    if (r) canvas.remove(r);
    const x = Math.round(r ? r.left : 0);
    const y = Math.round(r ? r.top : 0);
    const w = Math.round(r ? r.width : 0);
    const h = Math.round(r ? r.height : 0);
    if (!r || w < 4 || h < 4) { canvas.requestRenderAll(); return; }

    let region;
    try {
      region = canvas.toCanvasElement(1, { left: x, top: y, width: w, height: h });
    } catch (e) { canvas.requestRenderAll(); return; }
    if (!region) { canvas.requestRenderAll(); return; }

    const block = Math.max(4, Math.round(Math.min(w, h) / 20));
    const tw = Math.max(1, Math.floor(w / block));
    const th = Math.max(1, Math.floor(h / block));

    const small = document.createElement("canvas");
    small.width = tw; small.height = th;
    const sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(region, 0, 0, tw, th);

    const out = document.createElement("canvas");
    out.width = w; out.height = h;
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = false;
    octx.drawImage(small, 0, 0, tw, th, 0, 0, w, h);

    fabric.Image.fromURL(out.toDataURL(), function (mImg) {
      mImg.set({ left: x, top: y, scaleX: 1, scaleY: 1, selectable: false, evented: false });
      canvas.add(mImg);
      applyFlagsTo(mImg);
      canvas.requestRenderAll();
      snapshot();
    });
    canvas.requestRenderAll();
  }

  canvas.on("mouse:down", function (opt) {
    if (mode === "select" || mode === "text") return;
    startDraw(canvas.getPointer(opt.e));
  });
  canvas.on("mouse:move", function (opt) {
    if (mode === "select" || mode === "text") return;
    if (preview || mosaicRect) moveDraw(canvas.getPointer(opt.e));
  });
  canvas.on("mouse:up", function () {
    if (mode === "select" || mode === "text") return;
    endDraw();
  });

  // ---------- 文字 ----------
  canvas.on("mouse:down", function (opt) {
    if (mode !== "text") return;
    const p = canvas.getPointer(opt.e);
    const tb = new fabric.Textbox("双击编辑文字", {
      left: p.x, top: p.y,
      fontSize: parseInt(document.getElementById("tfSize").value, 10) || 28,
      fill: document.getElementById("tfColor").value || "#e24b4a",
      fontFamily: "sans-serif", width: 220
    });
    applyFlagsTo(tb);
    canvas.add(tb);
    canvas.setActiveObject(tb);
    canvas.requestRenderAll();
    snapshot();
    setMode("select");
    tb.enterEditing();
    tb.selectAll();
  });

  // ---------- 画布尺寸 / 背景 / 新建 / 自动调整 ----------
  function applySize() {
    const w = parseInt(document.getElementById("cw").value, 10) || 900;
    const h = parseInt(document.getElementById("ch").value, 10) || 600;
    setDesignSize(w, h);
    canvas.requestRenderAll();
    snapshot();
  }
  document.getElementById("applySize").addEventListener("click", applySize);

  document.getElementById("autoFitBtn").addEventListener("click", function () {
    const objs = canvas.getObjects();
    if (!objs.length) return;
    let maxX = 0, maxY = 0;
    objs.forEach(function (o) {
      const b = o.getBoundingRect(true, true);
      maxX = Math.max(maxX, b.left + b.width);
      maxY = Math.max(maxY, b.top + b.height);
    });
    const pad = 10;
    setDesignSize(maxX + pad, maxY + pad);
    document.getElementById("cw").value = Math.round(maxX + pad);
    document.getElementById("ch").value = Math.round(maxY + pad);
    canvas.requestRenderAll();
    snapshot();
  });

  document.getElementById("newCanvas").addEventListener("click", function () {
    if (canvas.getObjects().length && !confirm("新建画布将清空当前内容（可撤销）")) return;
    canvas.clear();
    canvas.backgroundColor = "#ffffff";
    const w = parseInt(document.getElementById("cw").value, 10) || 900;
    const h = parseInt(document.getElementById("ch").value, 10) || 600;
    setDesignSize(w, h);
    canvas.requestRenderAll();
    snapshot();
  });

  document.getElementById("bgWhite").addEventListener("click", function () {
    canvas.setBackgroundColor("#ffffff", canvas.requestRenderAll.bind(canvas));
    snapshot();
  });
  document.getElementById("bgTrans").addEventListener("click", function () {
    canvas.setBackgroundColor("", canvas.requestRenderAll.bind(canvas));
    snapshot();
  });

  // 缩放
  document.getElementById("zoomIn").addEventListener("click", function () { applyZoom(viewZoom * 1.2); });
  document.getElementById("zoomOut").addEventListener("click", function () { applyZoom(viewZoom / 1.2); });
  document.getElementById("zoomFit").addEventListener("click", fitToWindow);

  // ---------- 选中对象：阴影 / 边框 ----------
  document.getElementById("shadowBtn").addEventListener("click", function () {
    const o = canvas.getActiveObject();
    if (!o) { alert("请先选中一个对象（图片或图形）"); return; }
    if (o.shadow) {
      o.set("shadow", null);
    } else {
      o.set("shadow", new fabric.Shadow({ color: "rgba(0,0,0,0.35)", blur: 10, offsetX: 4, offsetY: 4 }));
    }
    canvas.requestRenderAll();
    snapshot();
  });

  function applyBorder() {
    const o = canvas.getActiveObject();
    if (!o) return;
    const w = parseInt(document.getElementById("bw").value, 10) || 0;
    o.set({
      stroke: document.getElementById("bcolor").value,
      strokeWidth: w,
      strokeUniform: true
    });
    canvas.requestRenderAll();
  }
  document.getElementById("bw").addEventListener("input", applyBorder);
  document.getElementById("bcolor").addEventListener("input", applyBorder);
  document.getElementById("bw").addEventListener("change", snapshot);
  document.getElementById("bcolor").addEventListener("change", snapshot);

  // ---------- 文字样式：实时套用到选中文字 ----------
  function applyTextStyle() {
    const o = canvas.getActiveObject();
    if (!o || !(o.type === "textbox" || o.type === "i-text" || o.type === "text")) return;
    o.set({
      fontSize: parseInt(document.getElementById("tfSize").value, 10) || 28,
      fill: document.getElementById("tfColor").value
    });
    canvas.requestRenderAll();
  }
  document.getElementById("tfSize").addEventListener("input", applyTextStyle);
  document.getElementById("tfColor").addEventListener("input", applyTextStyle);
  document.getElementById("tfSize").addEventListener("change", snapshot);
  document.getElementById("tfColor").addEventListener("change", snapshot);

  function syncTextControls() {
    const o = canvas.getActiveObject();
    if (o && (o.type === "textbox" || o.type === "i-text" || o.type === "text")) {
      document.getElementById("tfSize").value = o.fontSize || 28;
      if (typeof o.fill === "string") document.getElementById("tfColor").value = o.fill;
    }
  }
  canvas.on("selection:created", syncTextControls);
  canvas.on("selection:updated", syncTextControls);

  // ---------- 删除 / 清空 / 撤销 / 保存 ----------
  function deleteActive() {
    const objs = canvas.getActiveObjects();
    if (!objs.length) return;
    objs.forEach(function (o) { canvas.remove(o); });
    canvas.discardActiveObject();
    canvas.requestRenderAll();
    snapshot();
  }
  document.getElementById("delBtn").addEventListener("click", deleteActive);
  document.getElementById("clearBtn").addEventListener("click", function () {
    if (!confirm("确定清空画布？此操作可撤销。")) return;
    canvas.clear();
    canvas.backgroundColor = "#ffffff";
    canvas.requestRenderAll();
    snapshot();
  });
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("saveBtn").addEventListener("click", saveOverwriteOrDownload);
  document.getElementById("saveAsBtn").addEventListener("click", saveAs);

  window.addEventListener("keydown", function (e) {
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable);
    if (typing) return;
    const active = canvas.getActiveObject();
    if ((e.key === "Delete" || e.key === "Backspace") && active && !active.isEditing) {
      e.preventDefault(); deleteActive();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
      e.preventDefault(); undo();
    }
  });

  // 初始化
  applyZoom(1);
  snapshot();
  updateSourceInfo();
})();
</script>
</body>
</html>
